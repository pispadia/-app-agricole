{# Filtres du catalogue (espace client et catalogue public) #}
    <form method="GET" class="filtres">
        <input type="text" name="recherche" placeholder="🔍 Rechercher un produit (mil, oignon...)" value="{{ recherche }}">
        <select name="localite">
            <option value="">Toutes les localités</option>
            {% for l in localites %}
                <option value="{{ l.localite }}" {% if l.localite == localite_choisie %}selected{% endif %}>{{ l.localite }}</option>
            {% endfor %}
        </select>
        <select name="periode">
            <option value="">Disponible maintenant et à venir</option>
            <option value="maintenant" {% if periode_choisie == 'maintenant' %}selected{% endif %}>Disponible maintenant</option>
            <option value="a_venir" {% if periode_choisie == 'a_venir' %}selected{% endif %}>À venir (pré-commande)</option>
        </select>
        <select name="tri">
            <option value="recent" {% if tri_choisi == 'recent' %}selected{% endif %}>Plus récent</option>
            <option value="nom" {% if tri_choisi == 'nom' %}selected{% endif %}>Nom (A-Z)</option>
            <option value="localite" {% if tri_choisi == 'localite' %}selected{% endif %}>Localité (A-Z)</option>
            <option value="note" {% if tri_choisi == 'note' %}selected{% endif %}>Mieux notés</option>
        </select>
        <label class="filtre-promo"><input type="checkbox" name="promo" value="1" {% if promo_choisie %}checked{% endif %}> 🏷️ En promo</label>
        <button type="submit">Filtrer</button>
    </form>
