{% extends "base.html" %}
{% block contenu %}
    <h2>Mon profil</h2>
    <p style="color:#888; text-transform: capitalize;">Rôle : {{ utilisateur.role }}</p>

    {% if email_confirme %}
        <p><span class="badge badge-dispo">✓ Adresse e-mail confirmée</span></p>
    {% else %}
        <div class="flash">
            Ton adresse e-mail n'est pas encore confirmée.
            <form method="POST" action="{{ url_for('renvoyer_confirmation_email') }}" style="margin-top:8px;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" style="width:auto; padding:6px 12px; font-size:0.85em;">Recevoir le lien de confirmation</button>
            </form>
        </div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Nom</label>
        <input type="text" name="nom" value="{{ utilisateur.nom }}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ utilisateur.email }}" required>

        <label>Téléphone / WhatsApp (optionnel, visible par les personnes avec qui tu échanges)</label>
        <input type="tel" name="telephone" value="{{ utilisateur.telephone or '' }}" placeholder="ex: 77 123 45 67">

        <label>Nouveau mot de passe (laisser vide pour ne pas le changer, 8 caractères minimum)</label>
        <input type="password" name="nouveau_mot_de_passe" placeholder="Nouveau mot de passe" minlength="8">

        <label>Mot de passe actuel (requis pour confirmer)</label>
        <input type="password" name="mot_de_passe_actuel" placeholder="Ton mot de passe actuel" required>

        <button type="submit">Enregistrer les modifications</button>
    </form>
{% endblock %}
