{# Bouton WhatsApp, affiché seulement si la personne a renseigné un numéro #}
{% macro bouton_whatsapp(telephone, message="") %}
    {% if telephone %}
        <a href="{{ telephone | whatsapp }}{% if message %}?text={{ message | urlencode }}{% endif %}" target="_blank" rel="noopener"
           style="display:inline-block; margin-top:8px; padding:6px 12px; border-radius:5px; background:#25d366; color:white; text-decoration:none; font-size:0.85em;">💬 WhatsApp ({{ telephone }})</a>
    {% endif %}
{% endmacro %}
