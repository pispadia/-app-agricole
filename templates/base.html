<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>App Agricole</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f2;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2e7d32;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }
        .conteneur {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-family: inherit;
        }
        label {
            font-size: 0.9em;
            color: #555;
            margin-top: 8px;
            display: block;
        }
        .carte-recolte {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
        }
        .carte-recolte img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
        }
        .carte-recolte button {
            width: auto;
            padding: 6px 12px;
            font-size: 0.85em;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 8px;
        }
        .badge-dispo {
            background-color: #dff0d8;
            color: #2e7d32;
        }
        .badge-epuise {
            background-color: #f8d7da;
            color: #a94442;
        }
        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #256428;
        }
        .flash {
            background: #fff3cd;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <header>
        <div><strong>🌾 App Agricole</strong></div>
        <div>
            <a href="{{ url_for('accueil') }}">Accueil</a>
            {% if session.get('utilisateur_id') %}
                <a href="{{ url_for('deconnexion') }}">Déconnexion</a>
            {% else %}
                <a href="{{ url_for('connexion') }}">Connexion</a>
                <a href="{{ url_for('inscription') }}">Inscription</a>
            {% endif %}
        </div>
    </header>

    <div class="conteneur">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block contenu %}{% endblock %}
    </div>
</body>
</html>
