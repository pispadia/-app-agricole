{% extends "base.html" %}
{% block contenu %}
    {% set saisie = saisie or {} %}
    <h2>{{ "Créer un compte" | t }}</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="nom" value="{{ saisie.get('nom', '') }}" placeholder="{{ "Nom complet" | t }}" required>
        <input type="email" name="email" value="{{ saisie.get('email', '') }}" placeholder="{{ "Email" | t }}" required>
        <input type="tel" name="telephone" value="{{ saisie.get('telephone', '') }}" placeholder="{{ "Téléphone pour les alertes SMS (optionnel, jamais affiché)" | t }}">
        <input type="password" name="mot_de_passe" placeholder="{{ "Mot de passe (8 caractères minimum)" | t }}" minlength="8" required>

        <select name="role" required>
            <option value="" disabled {% if not saisie.get('role') %}selected{% endif %}>{{ "Je suis..." | t }}</option>
            <option value="client" {% if saisie.get('role') == 'client' %}selected{% endif %}>{{ "Client" | t }}</option>
            <option value="agriculteur" {% if saisie.get('role') == 'agriculteur' %}selected{% endif %}>{{ "Agriculteur" | t }}</option>
            <option value="fournisseur" {% if saisie.get('role') == 'fournisseur' %}selected{% endif %}>{{ "Fournisseur (semences / pépinières)" | t }}</option>
            <option value="financeur" {% if saisie.get('role') == 'financeur' %}selected{% endif %}>{{ "Organisme de financement" | t }}</option>
        </select>

        <label class="case-a-cocher">
            <input type="checkbox" name="conditions" required>
            <span>J'accepte les <a href="{{ url_for('conditions') }}" target="_blank">conditions d'utilisation</a> et la <a href="{{ url_for('confidentialite') }}" target="_blank">politique de confidentialité</a>.</span>
        </label>

        <button type="submit">{{ "S'inscrire" | t }}</button>
    </form>
{% endblock %}
